plugins { id 'com.android.application' }
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
android {
    namespace 'cn.local.golens'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.local.golens'
        minSdk 29
        targetSdk 34
        versionCode 14
        versionName '0.8.2'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libkatago.so'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
}
